    <main>

        <section class="contact-page">

            <div class="contact-content">

                <h1
                    data-sk="KONTAKT"
                    data-en="CONTACT"
                >KONTAKT</h1>

                <p
                    class="contact-intro"
                    data-sk="V prípade akýchkoľvek otázok ohľadne produktov, custom výroby, kúpy, prenájmu alebo s návrhmi na spoluprácu, ma neváhajte kontaktovať."

                    <div class="contact-item">
                        <h2
                            data-sk="E-mail:"
                            data-en="E-mail:"

                        <p>tereza​haze@gmail.com</p>
                    </div>


                    <div class="contact-item">
                        <h2
                            data-sk="Instagram:"
                            data-en="Instagram:"
                        >Instagram:</h2>

                        <p>@tereza_haze</p>
                    </div>

                </div>


                <a
                    href="#"
                    class="instagram-link"
                    aria-label="Instagram"
                >
                    <span class="instagram-placeholder">
                        IG
                    </span>
                </a>

            </div>


            <div class="contact-images">

                <!-- PLACEHOLDER IMAGE 1 -->
                <div class="contact-image contact-image-main">
                    <img
                        src="assets/images/Zbran.JPG"
                        alt="Tereza Haze"
                    >
                </div>


                <!-- PLACEHOLDER IMAGE 2 -->
                <div class="contact-image contact-image-side">
                    <img
                        src="assets/images/Okuliare.JPG"

                </div>

            </div>
